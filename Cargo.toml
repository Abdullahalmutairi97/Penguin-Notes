[package]
name = "penguin-notes"
version = "0.6.0"
edition = "2024"


[dependencies]
base64 = "0.23"
chrono = { version = "0.4.45", features = ["serde"] }
eframe = "0.36.2"
roxmltree = "0.21.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.4.2", features = ["json"] }
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
cpal = "0.16"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }

# Local fix for right-to-left (Arabic) glyph counting; see vendor/epaint/src/text/text_layout.rs.
[patch.crates-io]
epaint = { path = "vendor/epaint" }
